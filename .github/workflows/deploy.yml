name: Deploy

# Runs after CI passes on main, then waits for approval on the production environment.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  APPS_RESOURCE_GROUP: rg-apps
  PLATFORM_RESOURCE_GROUP: rg-platform
  REGISTRY_NAME: acccrshared
  POSTGRES_SERVER: accpsqlshared
  DATABASE_NAME: Gisr
  API_IDENTITY_NAME: id-gisr-api-prod
  API_APP_NAME: ca-gisr-api-prod
  WEB_APP_NAME: ca-gisr-web-prod
  DEPLOYER_NAME: gisr-github-oidc

jobs:
  deploy:
    name: deploy
    # Manual runs are allowed on any ref the environment permits; automatic runs need a green CI push run on main.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ steps.apps.outputs.web-url }}
    steps:
      - name: Check out the code that CI validated
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Sign in to Azure (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Choose the image tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Sign in to the container registry
        id: registry
        run: az acr login --name "$REGISTRY_NAME"

      - name: Build and push the Api image
        id: image-api
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          dotnet publish src/Gisr.Api/Gisr.Api.csproj -c Release -t:PublishContainer \
            -p:ContainerRuntimeIdentifier=linux-x64 \
            -p:ContainerRegistry="$REGISTRY_NAME.azurecr.io" \
            -p:ContainerRepository=gisr-api \
            -p:ContainerImageTags="$TAG"

      - name: Build and push the Web image
        id: image-web
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          dotnet publish src/Gisr.Web/Gisr.Web.csproj -c Release -t:PublishContainer \
            -p:ContainerRuntimeIdentifier=linux-x64 \
            -p:ContainerRegistry="$REGISTRY_NAME.azurecr.io" \
            -p:ContainerRepository=gisr-web \
            -p:ContainerImageTags="$TAG"

      - name: Deploy storage, database, and role assignments (rg-platform)
        id: platform
        run: |
          az deployment group create \
            --resource-group "$PLATFORM_RESOURCE_GROUP" \
            --name "gisr-platform-$GITHUB_RUN_ID" \
            --template-file infra/platform.bicep \
            --only-show-errors

      - name: Allow this runner through the PostgreSQL firewall
        id: firewall
        run: |
          ip="$(curl -fsS https://api.ipify.org)"
          az postgres flexible-server firewall-rule create \
            --resource-group "$PLATFORM_RESOURCE_GROUP" --server-name "$POSTGRES_SERVER" \
            --name "gisr-deploy-$GITHUB_RUN_ID" \
            --start-ip-address "$ip" --end-ip-address "$ip" --only-show-errors

      - name: Configure the database role and extension
        id: database
        run: |
          export API_IDENTITY_PRINCIPAL_ID="$(az identity show -g "$APPS_RESOURCE_GROUP" -n "$API_IDENTITY_NAME" --query principalId -o tsv)"
          export PG_SERVER="$POSTGRES_SERVER" PG_ADMIN_NAME="$DEPLOYER_NAME" PG_DATABASE="$DATABASE_NAME"
          bash infra/scripts/configure-database.sh

      - name: Remove the PostgreSQL firewall rule
        id: firewall-remove
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "$PLATFORM_RESOURCE_GROUP" --server-name "$POSTGRES_SERVER" \
            --name "gisr-deploy-$GITHUB_RUN_ID" --yes --only-show-errors || true

      - name: Deploy the container apps (rg-apps)
        id: apps
        run: |
          url="$(az deployment group create \
            --resource-group "$APPS_RESOURCE_GROUP" \
            --name "gisr-apps-$GITHUB_RUN_ID" \
            --template-file infra/apps.bicep \
            --parameters \
              imageTag='${{ steps.tag.outputs.tag }}' \
              tenantId='${{ vars.AZURE_TENANT_ID }}' \
              apiClientId='${{ vars.GISR_API_CLIENT_ID }}' \
              webClientId='${{ vars.GISR_WEB_CLIENT_ID }}' \
            --query properties.outputs.webUrl.value -o tsv --only-show-errors)"
          echo "web-url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify the deployment
        id: verify
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          WEB_URL: ${{ steps.apps.outputs.web-url }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          failed=0
          for app in "$API_APP_NAME" "$WEB_APP_NAME"; do
            base="https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$APPS_RESOURCE_GROUP/providers/Microsoft.App/containerApps/$app"
            mapfile -t info < <(az rest --method get --url "$base?api-version=2024-03-01" \
              --query "[properties.provisioningState, properties.template.containers[0].image, properties.latestRevisionName]" -o tsv)
            echo "$app: provisioning=${info[0]} image=${info[1]} revision=${info[2]}"
            [ "${info[0]}" = "Succeeded" ] || { echo "::error::$app provisioning state is ${info[0]}"; failed=1; }
            [[ "${info[1]}" == *":$TAG" ]] || { echo "::error::$app is not running image tag $TAG"; failed=1; }
            revision="$(az rest --method get --url "$base/revisions/${info[2]}?api-version=2024-03-01" \
              --query "[properties.provisioningState, properties.healthState, properties.runningState]" -o tsv | paste -sd ' ')"
            echo "$app revision: $revision"
            case "$revision" in *Failed*|*Unhealthy*) echo "::error::$app revision is unhealthy"; failed=1 ;; esac
          done
          ok=0
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$WEB_URL" || true)"
            echo "Web attempt $attempt: HTTP $code"
            case "$code" in 200|301|302|401) ok=1; break ;; esac
            sleep 15
          done
          [ "$ok" = 1 ] || { echo "::error::The Web app did not respond at $WEB_URL"; failed=1; }
          exit "$failed"

      # The Api scales to zero and is internal, so start one replica to surface startup and migration failures.
      - name: Check that the Api starts
        id: api-start
        env:
          AZURE_EXTENSION_USE_DYNAMIC_INSTALL: yes_without_prompt
          AZURE_EXTENSION_DYNAMIC_INSTALL_ALLOW_PREVIEW: 'true'
        run: |
          set -uo pipefail
          trap 'az containerapp update -g "$APPS_RESOURCE_GROUP" -n "$API_APP_NAME" --min-replicas 0 --only-show-errors -o none || true' EXIT
          az containerapp update -g "$APPS_RESOURCE_GROUP" -n "$API_APP_NAME" --min-replicas 1 --only-show-errors -o none \
            || { echo "::error::Could not start the Api"; exit 1; }
          stable=0
          for attempt in $(seq 1 30); do
            containers="$(az containerapp replica list -g "$APPS_RESOURCE_GROUP" -n "$API_APP_NAME" \
              --query "[].properties.containers[].{state:runningState,restarts:restartCount}" -o json --only-show-errors || echo '[]')"
            echo "Api attempt $attempt: $containers"
            if [ "$(jq '[.[] | select(.restarts > 0 or .state == "Terminated")] | length' <<< "$containers")" -gt 0 ]; then
              echo "::error::The Api is crashing or restarting"
              az containerapp logs show -g "$APPS_RESOURCE_GROUP" -n "$API_APP_NAME" --tail 60 --format text --only-show-errors || true
              exit 1
            fi
            if [ "$(jq 'length > 0 and all(.[]; .state == "Running")' <<< "$containers")" = true ]; then
              stable=$((stable + 1))
            else
              stable=0
            fi
            if [ "$stable" -ge 4 ]; then
              echo "The Api has stayed running without restarts."
              exit 0
            fi
            sleep 10
          done
          echo "::error::The Api did not reach a stable running state"
          az containerapp logs show -g "$APPS_RESOURCE_GROUP" -n "$API_APP_NAME" --tail 60 --format text --only-show-errors || true
          exit 1

      - name: Summarise the stages
        if: always()
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          WEB_URL: ${{ steps.apps.outputs.web-url }}
        run: |
          {
            echo "### Deployment stages"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Choose image tag | ${{ steps.tag.outcome }} |"
            echo "| Sign in to the registry | ${{ steps.registry.outcome }} |"
            echo "| Build and push Api image | ${{ steps.image-api.outcome }} |"
            echo "| Build and push Web image | ${{ steps.image-web.outcome }} |"
            echo "| Deploy platform (rg-platform) | ${{ steps.platform.outcome }} |"
            echo "| Open PostgreSQL firewall | ${{ steps.firewall.outcome }} |"
            echo "| Configure database | ${{ steps.database.outcome }} |"
            echo "| Close PostgreSQL firewall | ${{ steps.firewall-remove.outcome }} |"
            echo "| Deploy container apps (rg-apps) | ${{ steps.apps.outcome }} |"
            echo "| Verify deployment | ${{ steps.verify.outcome }} |"
            echo "| Check that the Api starts | ${{ steps.api-start.outcome }} |"
            echo
            echo "- Image tag: \`${TAG:-none}\`"
            echo "- Web: ${WEB_URL:-not deployed}"
          } >> "$GITHUB_STEP_SUMMARY"
